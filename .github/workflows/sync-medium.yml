name: Sync Medium articles

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: # "Run workflow" button for an instant sync

permissions:
  contents: write

concurrency:
  group: sync-medium
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull new posts from Medium
        run: node scripts/sync-medium.mjs

      - name: Commit if anything changed
        run: |
          if git diff --quiet -- index.html data/articles.json; then
            echo "Site already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/articles.json
          git commit -m "Add new Medium article to Writing"
          git push
